[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-booster"
version = "0.1.0"
description = "AI-powered Git wrapper using Ollama (local LLM) — no API key required"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml",
]

[project.scripts]
git-booster = "git_booster.cli:main"
gai = "git_booster.cli:main"

[tool.setuptools.packages.find]
where = ["."]
